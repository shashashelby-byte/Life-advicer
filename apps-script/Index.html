<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Advicer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #ffe9f3;
      --bg2: #e3f1ff;
      --bg3: #fff6d8;
      --ink: #3a2e4f;
      --ink-soft: #7a6c8f;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(80, 50, 120, .15);
      --accent: #8e7dff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Fredoka', system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), #e9ffe9);
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
      overflow-x: hidden;
      min-height: 100vh;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating background doodles */
    .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floaty {
      position: absolute; bottom: -60px; opacity: .55;
      animation: floatUp linear infinite;
      font-size: 22px;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120vh) rotate(360deg); }
    }

    .wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }

    header { text-align: center; margin-bottom: 8px; }
    h1 {
      font-size: clamp(34px, 7vw, 60px);
      margin: 0; letter-spacing: 1px;
      display: inline-flex; flex-wrap: wrap; justify-content: center;
    }
    h1 span {
      display: inline-block;
      animation: wave 2.4s ease-in-out infinite;
      text-shadow: 3px 3px 0 rgba(255,255,255,.9), 5px 5px 0 rgba(142,125,255,.25);
    }
    h1 span.space { width: .35em; }
    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }
    .subtitle { color: var(--ink-soft); font-size: 18px; margin: 6px 0 0; }
    .meta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .pill {
      background: rgba(255,255,255,.75); border-radius: 999px; padding: 6px 14px;
      font-size: 14px; box-shadow: 0 3px 10px rgba(80,50,120,.08);
    }

    /* Character stage */
    .stage {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
      margin: 28px 0 8px;
    }
    @media (max-width: 640px) {
      .stage { grid-template-columns: repeat(3, 1fr); }
    }
    .buddy {
      background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit;
      display: flex; flex-direction: column; align-items: center;
      transition: opacity .3s, transform .3s, filter .3s;
      animation: popIn .6s cubic-bezier(.34,1.56,.64,1) backwards;
    }
    .buddy:nth-child(2) { animation-delay: .08s; }
    .buddy:nth-child(3) { animation-delay: .16s; }
    .buddy:nth-child(4) { animation-delay: .24s; }
    .buddy:nth-child(5) { animation-delay: .32s; }
    @keyframes popIn {
      0% { transform: scale(0) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .buddy .body-wrap { width: 100%; max-width: 140px; aspect-ratio: 1; position: relative; }
    .buddy svg { width: 100%; height: 100%; overflow: visible; animation: bob 3s ease-in-out infinite; }
    .buddy:nth-child(2) svg { animation-duration: 3.4s; }
    .buddy:nth-child(3) svg { animation-duration: 2.8s; }
    .buddy:nth-child(4) svg { animation-duration: 3.8s; }
    .buddy:nth-child(5) svg { animation-duration: 3.1s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .buddy .shadow {
      width: 60%; height: 10px; margin: -6px auto 0; border-radius: 50%;
      background: rgba(60, 40, 90, .15); animation: shadowPulse 3s ease-in-out infinite;
    }
    @keyframes shadowPulse { 50% { transform: scaleX(.8); opacity: .6; } }
    .buddy .name { font-weight: 700; font-size: 18px; margin-top: 6px; }
    .buddy .role { font-size: 13px; color: var(--ink-soft); }
    .buddy:hover svg, .buddy:focus-visible svg { animation: wiggle .5s ease-in-out; }
    .buddy:focus-visible { outline: 3px dashed var(--accent); outline-offset: 6px; border-radius: 16px; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    .stage.has-active .buddy:not(.active) { opacity: .45; filter: grayscale(.4); transform: scale(.9); }
    .buddy.active { transform: scale(1.08); }
    .buddy.active svg { animation: hop .6s cubic-bezier(.34,1.56,.64,1), bob 3s ease-in-out .6s infinite; }
    @keyframes hop {
      0% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(4px) scale(1.1, .9); }
      60% { transform: translateY(-26px) scale(.95, 1.05); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* Shared character parts */
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    .buddy:nth-child(2) .eyes { animation-delay: 1.3s; }
    .buddy:nth-child(3) .eyes { animation-delay: 2.1s; }
    .buddy:nth-child(4) .eyes { animation-delay: .6s; }
    .buddy:nth-child(5) .eyes { animation-delay: 3s; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(.1); }
    }
    .mouth { transform-box: fill-box; transform-origin: center; }
    .talking .mouth { animation: talk .22s ease-in-out infinite alternate; }
    @keyframes talk { from { transform: scaleY(.4); } to { transform: scaleY(1.3); } }
    .rays { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 1.6s ease-in-out infinite alternate; }
    @keyframes swish { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
    .wing-l { transform-box: fill-box; transform-origin: 100% 20%; animation: flapL 2.2s ease-in-out infinite; }
    .wing-r { transform-box: fill-box; transform-origin: 0% 20%; animation: flapR 2.2s ease-in-out infinite; }
    @keyframes flapL { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(18deg); } }
    @keyframes flapR { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(-18deg); } }
    .antenna-light { animation: glow 1.2s ease-in-out infinite alternate; }
    @keyframes glow { from { fill: #ffe066; } to { fill: #ff6b6b; } }
    .throat { transform-box: fill-box; transform-origin: center; animation: croak 3.5s ease-in-out infinite; }
    @keyframes croak { 0%, 85%, 100% { transform: scale(1); } 92% { transform: scale(1.25, 1.4); } }

    /* Advice panel */
    .panel {
      background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
      padding: 22px; margin-top: 18px; position: relative;
      transition: border-color .4s;
      border: 4px solid transparent;
    }
    .panel::before {
      content: ''; position: absolute; top: -18px; left: var(--tail-x, 50%);
      width: 30px; height: 30px; background: var(--card);
      border-left: 4px solid; border-top: 4px solid; border-color: inherit;
      transform: translateX(-50%) rotate(45deg); border-radius: 6px 0 0 0;
      transition: left .45s cubic-bezier(.34,1.56,.64,1);
    }
    .panel.hidden-tail::before { display: none; }
    .bubble-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bubble-head .who { font-weight: 700; font-size: 20px; }
    .bubble-head .tag {
      font-size: 12px; padding: 3px 10px; border-radius: 999px; color: #fff; font-weight: 600;
    }
    .advice {
      font-size: clamp(18px, 2.6vw, 22px); line-height: 1.5; min-height: 3em;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .advice .caret {
      display: inline-block; width: 2px; height: 1em; background: currentColor;
      vertical-align: -2px; margin-left: 2px; animation: caret .7s steps(1) infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }
    .placeholder { color: var(--ink-soft); }
    .dots { display: inline-flex; gap: 6px; padding: 8px 0; }
    .dots i {
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
      animation: dot 1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-8px); opacity: 1; } }
    .error { color: #c0392b; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn {
      font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer;
      padding: 12px 18px; border-radius: 16px; color: #fff;
      background: var(--accent); box-shadow: 0 5px 0 rgba(0,0,0,.15);
      transition: transform .1s, box-shadow .1s, filter .2s;
    }
    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
    .btn:disabled { opacity: .55; cursor: wait; transform: none; }
    .btn.ghost { background: #f1ecff; color: var(--ink); }
    .ask { display: flex; gap: 8px; flex: 1 1 320px; }
    .ask input {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 16px;
      border-radius: 16px; border: 3px solid #eee6ff; outline: none; color: var(--ink);
      transition: border-color .2s;
    }
    .ask input:focus { border-color: var(--accent); }

    footer { text-align: center; margin-top: 26px; color: var(--ink-soft); font-size: 13px; }

    /* Confetti */
    .confetti {
      position: fixed; top: -12px; width: 10px; height: 14px; z-index: 50; pointer-events: none;
      border-radius: 2px; animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: .9; }
    }
    .heart {
      position: fixed; z-index: 50; pointer-events: none; font-size: 22px;
      animation: heartUp 1.2s ease-out forwards;
    }
    @keyframes heartUp {
      0% { transform: translate(-50%, 0) scale(.4); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), -110px) scale(1.2); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
      .floaty, .confetti, .heart { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <h1 id="title" aria-label="Life Advicer"></h1>
      <p class="subtitle">Pick a little buddy and get your advice for today ✨</p>
      <div class="meta">
        <span class="pill" id="today"></span>
        <span class="pill" id="streak"></span>
      </div>
    </header>

    <div class="stage" id="stage" role="list"></div>

    <section class="panel hidden-tail" id="panel" aria-live="polite">
      <div class="bubble-head" id="bubbleHead" hidden>
        <span class="who" id="who"></span>
        <span class="tag" id="tag"></span>
      </div>
      <div class="advice" id="advice"><span class="placeholder">👆 Tap a character to say hi!</span></div>

      <div class="controls" id="controls" hidden>
        <button class="btn" id="dailyBtn" type="button">🌞 Today's advice</button>
        <form class="ask" id="askForm" autocomplete="off">
          <input id="askInput" maxlength="500" placeholder="Ask me anything…" aria-label="Your question">
          <button class="btn ghost" id="askBtn" type="submit">Ask 💬</button>
        </form>
      </div>
    </section>

    <footer id="footer">Made with love · Advice by Claude · Be kind to yourself today</footer>
  </div>

  <script>
    const CHARACTERS = [
      { id: 'sunny', name: 'Sunny', role: 'Motivation', color: '#ffb703',
        hello: "Good morning, sunshine! Want a little boost of energy for today? Tap the button!" },
      { id: 'mossy', name: 'Mossy', role: 'Mindfulness', color: '#52b788',
        hello: "Ribbit… hello, friend. Take one slow breath with me. Then let's chat." },
      { id: 'pip', name: 'Pip', role: 'Self-care', color: '#ff6f91',
        hello: "Oh. It's you. I suppose I *could* share some wisdom… if you ask nicely." },
      { id: 'luna', name: 'Luna', role: 'Reflection', color: '#7b68ee',
        hello: "Hoo… welcome, little one. The stars have something to tell you today." },
      { id: 'bolt', name: 'Bolt', role: 'Productivity', color: '#4d96ff',
        hello: "BEEP BOOP! Advice unit online. Ready to optimize your day!" }
    ];

    const SVGS = {
      sunny: `
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g class="rays" fill="#ffd166">
            ${Array.from({ length: 12 }, (_, i) =>
              `<path d="M60 4 L66 20 L54 20 Z" transform="rotate(${i * 30} 60 60)"/>`).join('')}
          </g>
          <circle cx="60" cy="60" r="36" fill="#ffc300"/>
          <circle cx="60" cy="60" r="36" fill="url(#sunShine)"/>
          <defs><radialGradient id="sunShine" cx=".35" cy=".3" r=".7">
            <stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffc300" stop-opacity="0"/>
          </radialGradient></defs>
          <g class="eyes" fill="#3a2e4f">
            <ellipse cx="48" cy="56" rx="4.5" ry="6"/><ellipse cx="72" cy="56" rx="4.5" ry="6"/>
            <circle cx="49.5" cy="53.5" r="1.6" fill="#fff"/><circle cx="73.5" cy="53.5" r="1.6" fill="#fff"/>
          </g>
          <circle cx="40" cy="68" r="5" fill="#ff8fab" opacity=".7"/><circle cx="80" cy="68" r="5" fill="#ff8fab" opacity=".7"/>
          <path class="mouth" d="M50 70 Q60 82 70 70 Q60 75 50 70 Z" fill="#3a2e4f"/>
        </svg>`,
      mossy: `
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <ellipse cx="60" cy="102" rx="44" ry="8" fill="#95d5b2"/>
          <ellipse cx="60" cy="74" rx="40" ry="30" fill="#74c69d"/>
          <ellipse cx="60" cy="84" rx="24" ry="16" fill="#b7e4c7"/>
          <ellipse class="throat" cx="60" cy="86" rx="10" ry="6" fill="#d8f3dc"/>
          <circle cx="40" cy="44" r="15" fill="#74c69d"/><circle cx="80" cy="44" r="15" fill="#74c69d"/>
          <g class="eyes">
            <circle cx="40" cy="44" r="9" fill="#fff"/><circle cx="80" cy="44" r="9" fill="#fff"/>
            <circle cx="41" cy="46" r="5" fill="#3a2e4f"/><circle cx="81" cy="46" r="5" fill="#3a2e4f"/>
            <path d="M31 40 Q40 35 49 40" stroke="#52b788" stroke-width="3" fill="none"/>
            <path d="M71 40 Q80 35 89 40" stroke="#52b788" stroke-width="3" fill="none"/>
          </g>
          <path class="mouth" d="M38 66 Q60 80 82 66 Q60 72 38 66 Z" fill="#2d6a4f"/>
          <circle cx="32" cy="66" r="4" fill="#ff8fab" opacity=".6"/><circle cx="88" cy="66" r="4" fill="#ff8fab" opacity=".6"/>
          <ellipse cx="30" cy="100" rx="10" ry="5" fill="#52b788"/><ellipse cx="90" cy="100" rx="10" ry="5" fill="#52b788"/>
        </svg>`,
      pip: `
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path class="tail" d="M88 96 Q112 90 106 62 Q104 54 98 58 Q104 82 84 88 Z" fill="#ffb3c6"/>
          <ellipse cx="60" cy="92" rx="28" ry="20" fill="#ffc8dd"/>
          <path d="M28 40 L34 12 L52 30 Z" fill="#ffc8dd"/><path d="M92 40 L86 12 L68 30 Z" fill="#ffc8dd"/>
          <path d="M33 34 L36 20 L46 30 Z" fill="#ff8fab"/><path d="M87 34 L84 20 L74 30 Z" fill="#ff8fab"/>
          <circle cx="60" cy="54" r="32" fill="#ffc8dd"/>
          <g class="eyes" fill="#3a2e4f">
            <ellipse cx="47" cy="52" rx="5" ry="7"/><ellipse cx="73" cy="52" rx="5" ry="7"/>
            <circle cx="48.5" cy="49" r="1.8" fill="#fff"/><circle cx="74.5" cy="49" r="1.8" fill="#fff"/>
          </g>
          <path d="M57 62 L63 62 L60 66 Z" fill="#ff6f91"/>
          <path class="mouth" d="M54 68 Q57 72 60 68 Q63 72 66 68" stroke="#3a2e4f" stroke-width="2" fill="none" stroke-linecap="round"/>
          <g stroke="#c9a0b4" stroke-width="1.6" stroke-linecap="round">
            <path d="M40 62 L22 58"/><path d="M40 66 L22 68"/><path d="M80 62 L98 58"/><path d="M80 66 L98 68"/>
          </g>
          <circle cx="40" cy="64" r="4" fill="#ff8fab" opacity=".5"/><circle cx="80" cy="64" r="4" fill="#ff8fab" opacity=".5"/>
        </svg>`,
      luna: `
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path class="wing-l" d="M28 60 Q12 80 24 100 Q34 90 34 70 Z" fill="#6a5acd"/>
          <path class="wing-r" d="M92 60 Q108 80 96 100 Q86 90 86 70 Z" fill="#6a5acd"/>
          <path d="M30 34 L36 14 L48 30 Z" fill="#7b68ee"/><path d="M90 34 L84 14 L72 30 Z" fill="#7b68ee"/>
          <ellipse cx="60" cy="66" rx="34" ry="40" fill="#8e7dff"/>
          <ellipse cx="60" cy="82" rx="20" ry="20" fill="#d6ccff"/>
          <g fill="#b8acff"><path d="M52 76 q4 4 8 0"/><path d="M60 84 q4 4 8 0"/><path d="M52 90 q4 4 8 0"/></g>
          <circle cx="46" cy="50" r="14" fill="#fff"/><circle cx="74" cy="50" r="14" fill="#fff"/>
          <circle cx="46" cy="50" r="14" fill="none" stroke="#ffd166" stroke-width="3"/>
          <circle cx="74" cy="50" r="14" fill="none" stroke="#ffd166" stroke-width="3"/>
          <g class="eyes" fill="#3a2e4f">
            <circle cx="46" cy="51" r="7"/><circle cx="74" cy="51" r="7"/>
            <circle cx="48.5" cy="48" r="2.4" fill="#fff"/><circle cx="76.5" cy="48" r="2.4" fill="#fff"/>
          </g>
          <path class="mouth" d="M55 63 L65 63 L60 72 Z" fill="#ffb703"/>
          <ellipse cx="50" cy="105" rx="6" ry="3" fill="#ffb703"/><ellipse cx="70" cy="105" rx="6" ry="3" fill="#ffb703"/>
        </svg>`,
      bolt: `
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <line x1="60" y1="22" x2="60" y2="8" stroke="#8d99ae" stroke-width="3"/>
          <circle class="antenna-light" cx="60" cy="7" r="5" fill="#ffe066"/>
          <rect x="26" y="22" width="68" height="54" rx="16" fill="#a2d2ff"/>
          <rect x="34" y="30" width="52" height="34" rx="10" fill="#1d3557"/>
          <g class="eyes" fill="#90e0ef">
            <rect x="42" y="38" width="10" height="12" rx="3"/><rect x="68" y="38" width="10" height="12" rx="3"/>
          </g>
          <rect class="mouth" x="52" y="54" width="16" height="4" rx="2" fill="#90e0ef"/>
          <rect x="18" y="40" width="8" height="18" rx="3" fill="#8d99ae"/><rect x="94" y="40" width="8" height="18" rx="3" fill="#8d99ae"/>
          <rect x="36" y="80" width="48" height="28" rx="10" fill="#bde0fe"/>
          <circle cx="50" cy="92" r="4" fill="#ff6b6b"/><circle cx="60" cy="92" r="4" fill="#ffd166"/><circle cx="70" cy="92" r="4" fill="#06d6a0"/>
          <rect x="26" y="84" width="8" height="18" rx="4" fill="#a2d2ff"/><rect x="86" y="84" width="8" height="18" rx="4" fill="#a2d2ff"/>
        </svg>`
    };

    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    const panel = $('panel');
    const adviceEl = $('advice');
    let active = null;
    let typingTimer = null;
    let busy = false;

    // ---------- storage helpers (localStorage may be blocked inside iframes) ----------
    function store(key, value) {
      try {
        if (value === undefined) return JSON.parse(localStorage.getItem('lifeAdvicer.' + key));
        localStorage.setItem('lifeAdvicer.' + key, JSON.stringify(value));
      } catch (e) { return null; }
    }
    const todayKey = () => new Date().toISOString().slice(0, 10);

    // ---------- header ----------
    $('title').innerHTML = [...'Life Advicer'].map((ch, i) =>
      ch === ' ' ? '<span class="space"></span>' : `<span style="animation-delay:${i * 0.08}s">${ch}</span>`).join('');
    $('today').textContent = '📅 ' + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

    (function updateStreak() {
      const s = store('streak') || { last: null, count: 0 };
      const today = todayKey();
      const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      if (s.last !== today) {
        s.count = s.last === yesterday ? s.count + 1 : 1;
        s.last = today;
        store('streak', s);
      }
      $('streak').textContent = `🔥 ${s.count}-day streak`;
    })();

    // ---------- floating background ----------
    (function sky() {
      const bits = ['✨', '☁️', '⭐', '🌸', '💫', '🍀', '💖', '🌈'];
      const sky = $('sky');
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.className = 'floaty';
        el.textContent = bits[i % bits.length];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = 14 + Math.random() * 22 + 'px';
        el.style.animationDuration = 14 + Math.random() * 18 + 's';
        el.style.animationDelay = -Math.random() * 30 + 's';
        sky.appendChild(el);
      }
    })();

    // ---------- characters ----------
    CHARACTERS.forEach((c) => {
      const btn = document.createElement('button');
      btn.className = 'buddy';
      btn.type = 'button';
      btn.setAttribute('role', 'listitem');
      btn.setAttribute('aria-label', `${c.name}, ${c.role}`);
      btn.dataset.id = c.id;
      btn.innerHTML = `<div class="body-wrap">${SVGS[c.id]}</div><div class="shadow"></div>
        <div class="name">${c.name}</div><div class="role">${c.role}</div>`;
      btn.addEventListener('click', (ev) => select(c, btn, ev));
      stage.appendChild(btn);
    });

    function select(c, btn, ev) {
      if (busy) return;
      active = c;
      document.querySelectorAll('.buddy').forEach((b) => b.classList.remove('active'));
      // restart the hop animation
      void btn.offsetWidth;
      btn.classList.add('active');
      stage.classList.add('has-active');
      document.documentElement.style.setProperty('--accent', c.color);

      panel.style.borderColor = c.color;
      panel.classList.remove('hidden-tail');
      positionTail(btn);

      $('bubbleHead').hidden = false;
      $('who').textContent = c.name;
      $('tag').textContent = c.role;
      $('tag').style.background = c.color;
      $('controls').hidden = false;
      $('askInput').placeholder = `Ask ${c.name} anything…`;

      hearts(ev.clientX, ev.clientY, c.color);

      const saved = store('daily.' + c.id);
      if (saved && saved.date === todayKey()) {
        typeOut(saved.text, btn);
      } else {
        typeOut(c.hello, btn);
      }
    }

    function positionTail(btn) {
      const p = panel.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const x = Math.min(Math.max(b.left + b.width / 2 - p.left, 30), p.width - 30);
      panel.style.setProperty('--tail-x', x + 'px');
    }
    window.addEventListener('resize', () => {
      const btn = document.querySelector('.buddy.active');
      if (btn) positionTail(btn);
    });

    function activeBtn() { return document.querySelector('.buddy.active'); }

    function typeOut(text, btn) {
      clearInterval(typingTimer);
      adviceEl.classList.remove('error');
      adviceEl.textContent = '';
      const span = document.createElement('span');
      const caret = document.createElement('span');
      caret.className = 'caret';
      adviceEl.append(span, caret);
      btn = btn || activeBtn();
      if (btn) btn.classList.add('talking');
      let i = 0;
      typingTimer = setInterval(() => {
        span.textContent = text.slice(0, ++i);
        if (i >= text.length) {
          clearInterval(typingTimer);
          caret.remove();
          if (btn) btn.classList.remove('talking');
        }
      }, 22);
    }

    function thinking() {
      clearInterval(typingTimer);
      adviceEl.classList.remove('error');
      adviceEl.innerHTML = '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>';
    }

    function setBusy(state) {
      busy = state;
      $('dailyBtn').disabled = state;
      $('askBtn').disabled = state;
    }

    // ---------- server calls ----------
    function callServer(fnName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((err) => reject(err))
            [fnName](...args);
        } else {
          // Preview mode outside Apps Script: canned answers so the page can be tried locally.
          setTimeout(() => resolve(DEMO[active.id][Math.floor(Math.random() * DEMO[active.id].length)]), 900);
        }
      });
    }

    const DEMO = {
      sunny: ["Today, start with one tiny win: make your bed or open a window! Little victories warm you up for the big ones. Go shine! ☀️"],
      mossy: ["Ribbit… before you rush, pause at a doorway today and take three slow breaths. Notice one sound you usually miss."],
      pip: ["Darling, you are allowed to say no to one thing today. Use that time for a nap, a snack, or simply staring at a wall. Iconic."],
      luna: ["Hoo… tonight, write down one moment that made you smile. Small lights add up to a sky full of stars."],
      bolt: ["BEEP! Pick your single most important task and give it 25 focused minutes. Then reward your circuits with a stretch break!"]
    };

    async function getDaily() {
      if (!active || busy) return;
      const c = active;
      const btn = activeBtn();
      setBusy(true);
      thinking();
      try {
        const text = await callServer('getDailyAdvice', c.id);
        store('daily.' + c.id, { date: todayKey(), text });
        if (active === c) {
          typeOut(text, btn);
          confetti(c.color);
        }
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    async function ask(ev) {
      ev.preventDefault();
      if (!active || busy) return;
      const input = $('askInput');
      const q = input.value.trim();
      if (!q) { input.focus(); return; }
      const c = active;
      const btn = activeBtn();
      setBusy(true);
      thinking();
      try {
        const text = await callServer('askCharacter', c.id, q);
        input.value = '';
        if (active === c) {
          typeOut(text, btn);
          const r = btn.getBoundingClientRect();
          hearts(r.left + r.width / 2, r.top + r.height / 3, c.color);
        }
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    function showError(err) {
      clearInterval(typingTimer);
      document.querySelectorAll('.buddy').forEach((b) => b.classList.remove('talking'));
      adviceEl.classList.add('error');
      const msg = (err && err.message) ? err.message.replace(/^Exception:\s*/, '') : 'Something went wrong.';
      adviceEl.textContent = '😵 ' + msg;
    }

    $('dailyBtn').addEventListener('click', getDaily);
    $('askForm').addEventListener('submit', ask);

    // ---------- effects ----------
    function confetti(main) {
      const colors = [main, '#ffd166', '#ff6f91', '#06d6a0', '#4d96ff', '#b8acff'];
      for (let i = 0; i < 70; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[i % colors.length];
        el.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
        el.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
        el.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
        el.style.animationDelay = Math.random() * .4 + 's';
        if (i % 3 === 0) el.style.borderRadius = '50%';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function hearts(x, y, color) {
      const icons = ['💖', '✨', '⭐', '💫'];
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'heart';
        el.textContent = icons[i % icons.length];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
        el.style.animationDelay = i * 0.06 + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }
  </script>
</body>
</html>
